<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
		<link rel="modulepreload" href="./main.js" />
		<link rel="modulepreload" href="./_framework/dotnet.js" />
		<style>
            html, body {
				margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
				background-color: black;
				overflow: hidden;
			}

            body {
                /* dvh excludes the mobile browser ui, 100vh does not */
                height: 100dvh;
                display: flex;
                align-items: center;
                justify-content: center;
            }

			canvas#canvas {
                display: block;
                width: 100%;
                height: 100%;
				outline: none;
				margin: 0;
                padding: 0;
                border: 0;
                /* disables browser gestures: scroll, pinch zoom, double tap zoom */
                touch-action: none;
			}

            /*
                letterboxing. the canvas stays centered by the flexbox of the body

				canvas#canvas {
                    width: auto;
                    height: auto;
                    max-width: 100%;
                    max-height: 100%;
                    aspect-ratio: 16 / 9;
			}
			*/

		</style>
	</head>
	<body>
		<canvas id="canvas" width="16" height="9">
		</canvas>

		<script type="module" src="./main.js"></script>
	</body>
</html>
